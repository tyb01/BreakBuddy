name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare signing from environment secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - run: python3 scripts/check_source.py
      - run: bash gradlew testDebugUnitTest testReleaseUnitTest lintDebug lintRelease processDebugManifest processReleaseManifest bundleRelease --console=plain
      - run: python3 scripts/check_permissions.py
      - name: Verify archive signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: |
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
            app/build/outputs/native-debug-symbols/release/
            app/build/reports/
      - name: Remove temporary signing files
        if: always()
        run: rm -f keystore.properties upload-key.jks
