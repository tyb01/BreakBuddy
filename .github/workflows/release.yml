name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: python3 scripts/run_gitleaks.py
      - name: Prepare signing from environment secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/prepare_signing.py
      - run: python3 scripts/check_source.py
      - run: python3 scripts/scan_secrets.py
      - run: python3 -m unittest discover -s scripts/tests
      - run: bash gradlew testDebugUnitTest testReleaseUnitTest lintDebug lintRelease processDebugManifest processReleaseManifest bundleRelease --dependency-verification strict --console=plain
      - run: python3 scripts/check_permissions.py
      - run: python3 scripts/check_build_security.py
      - name: Verify archive signature
        run: |
          python3 scripts/check_signed_bundle.py app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-candidate
          path: |
            app/build/outputs/bundle/release/
            app/build/outputs/mapping/release/
            app/build/outputs/native-debug-symbols/release/
            app/build/reports/
      - name: Remove temporary signing files
        if: always()
        run: rm -f keystore.properties upload-key.jks
